# Triggered by a `vX.Y.Z` tag. Builds a multi-arch (amd64+arm64) image and pushes it to
# ghcr.io/slipmesh/bird, tagged with the release version and `latest` - mirrors
# slipmesh/operators' and slipmesh/helm's own release workflows.
#
# Unlike slipmesh/operators (Rust, cross-compiled via cargo-zigbuild because a full rustc build
# segfaults under QEMU for a non-native --platform), this is a small C build - buildx's own
# multi-platform support (QEMU-emulated for the non-native leg) handles it fine in one step, no
# per-arch build-then-merge dance needed.
name: Release image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
